version: '3'
info:
  companyName: "WarpScout Developer"
  productName: "WarpScout Chain"
  productIdentifier: "com.warpscout.chain"
  description: "Warp endpoint scanner and configuration generator"
  copyright: "Copyright 2026"
  comments: "Warp-on-Warp AI Unlocker"
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task common:install:frontend:deps
      type: once
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: go mod tidy
      type: blocking
    - cmd: wails3 task build
      type: blocking
    - cmd: wails3 task run
      type: primary
