name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "wails.json"
      - "frontend/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
          cache-dependency-path: go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wails version

      - name: Download Go modules
        run: go mod download

      - name: Verify source formatting
        shell: pwsh
        run: |
          $diff = gofmt -d main.go app.go
          if ($diff) {
            Write-Host $diff
            exit 1
          }

      - name: Build Windows EXE
        run: wails build -clean -platform windows/amd64 -ldflags "-s -w -H windowsgui"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "build\bin\WarpScoutChain.exe"
          if (!(Test-Path $exe)) {
            Write-Error "EXE not found: $exe"
            exit 1
          }
          $item = Get-Item $exe
          Write-Host "Built: $($item.FullName)"
          Write-Host "Size: $([math]::Round($item.Length / 1MB, 2)) MB"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarpScoutChain-Windows-x64
          path: build/bin/WarpScoutChain.exe
          if-no-files-found: error
          retention-days: 14
