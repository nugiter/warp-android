name: Build Android APK (Wails mobile migration)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android toolchain / migration scaffold
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.22.x'
          cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK/NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          go version
          java -version
          adb version || true
          wails3 version || true

      - name: Validate migration files
        run: |
          test -f android/README.md
          test -f android/MIGRATION.md
          test -f go.mod
          echo "Android migration scaffold is present."

      - name: Upload Android migration package
        uses: actions/upload-artifact@v4
        with:
          name: WarpScoutChain-Android-migration-scaffold
          path: android/
          if-no-files-found: error
          retention-days: 14
